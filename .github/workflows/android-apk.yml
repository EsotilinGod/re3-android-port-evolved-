name: Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Parchar librw (vsync)
        run: git -C vendor/librw apply ../../android/patches/librw-vsync.patch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Compilar APK (release)
        working-directory: android/launcher
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleStandardRelease 2>&1 | tee build.log

      - name: Mostrar errores de compilacion
        if: failure()
        working-directory: android/launcher
        run: grep -E "error:|undefined|FAILED|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: re3-android-teclado-raton
          path: android/launcher/app/build/outputs/apk/**/*.apk
