name: Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Compilar APK (release)
        working-directory: android/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleStandardRelease

      - uses: actions/upload-artifact@v4
        with:
          name: re3-android-teclado-raton
          path: android/launcher/app/build/outputs/apk/**/*.apk
